# Build Windows GUI (PyInstaller onedir) and publish to GitHub Releases on version tags.
#
# Publish:
#   git tag v0.3.0
#   git push origin v0.3.0
#
# Manual test (artifact only, no Release):
#   GitHub → Actions → Release Windows → Run workflow

name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and run tests
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[gui,build,dev]"
          python -m pytest -q

      - name: Build with PyInstaller
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean hp_wash_thief.spec

      - name: Package zip
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
          } else {
            $version = "manual-${{ github.run_number }}"
          }
          $zip = "MapleRoyalsHpWash-$version-win64.zip"
          Compress-Archive -Path dist\MapleRoyalsHpWash -DestinationPath $zip -Force
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: MapleRoyals HP Wash ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}
          body: |
            ## Windows 桌面版

            1. 下載 **`MapleRoyalsHpWash-*-win64.zip`**
            2. 解壓縮整個資料夾
            3. 執行 **`MapleRoyalsHpWash.exe`**

            > 請保留資料夾內所有 DLL／檔案，不要只複製 `.exe`。

            ## 開發者

            原始碼建置：`scripts\build_windows.bat`

      - name: Upload build artifact (manual / non-tag runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 14
